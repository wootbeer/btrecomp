# N64Recomp config for BattleTanx (USA) 1.0.
#
# The symbol file is generated (tools/find_functions.py, tools/make_syms.py);
# see BattleTanxSyms/README.md. Hand-written fixes come first below, then the
# generated divide-by-zero guards (tools/gen_div_guards.py).

[input]
entrypoint = 0x80071000
output_func_path = "RecompiledFuncs"
rom_file_path = "BattleTanx (USA).z64"
symbols_file_path = "BattleTanxSyms/battletanx.us.rev0.syms.toml"

[patches]
# Cache-invalidation loops from the game's own exception-vector setup
# (func_80077110 installs its vectors, then calls these). The host's caches
# are coherent, and N64Recomp can't translate `cache`.
stubs = ["func_800771BC", "func_800771D8"]
ignored = []

# --- Busy-wait loops ---------------------------------------------------------
# On the N64 an interrupt lets another thread run while one spins on a flag.
# The runtime only switches threads at OS calls, so a loop that polls memory
# without making one never lets the thread that would release it run. Each of
# these yields (btx_yield_via_priority_drop, src/main/scheduler_workaround.cpp)
# while it waits. They are the same engine loops the sequel's port fixed; the
# sequel's addresses are given for reference.
#
# A hook's text goes before the instruction at before_vram, after any label
# there, so a hook on a loop head runs on every pass.

# func_80079064 waits until the VI manager's state (0x8014E0D0, 0x208 bytes)
# shows nothing pending and a retrace count of at least 5, by copying the block
# to the stack and checking the copy (sequel: func_800A1384). Two loop heads:
# the outer re-copy and the copy loop itself, which one check jumps straight
# back to.
[[patches.hook]]
func = "func_80079064"
before_vram = 0x80079078
text = """
    btx_yield_via_priority_drop(rdram);
"""

[[patches.hook]]
func = "func_80079064"
before_vram = 0x8007907C
text = """
    btx_yield_via_priority_drop(rdram);
"""

# func_8007A5A4 builds the audio task and hands it over through the slot at
# 0x80125764, first waiting for the previous one to be taken. It loads the slot
# once and spins on the register (sequel: func_80097844), so re-read it too.
[[patches.hook]]
func = "func_8007A5A4"
before_vram = 0x8007A70C
text = """
    if (ctx->r2 != 0) { btx_yield_via_priority_drop(rdram); ctx->r2 = MEM_W(S32(0x8012 << 16), 0x5764); }
"""

# func_8007D850 waits for field 0xD4 of the graphics state (pointer at
# 0x801257C8) to be set: the back edge of that loop.
[[patches.hook]]
func = "func_8007D850"
before_vram = 0x8007D890
text = """
    btx_yield_via_priority_drop(rdram);
"""

# func_8007E248 picks a free framebuffer (sequel: func_8007A818). The state
# struct is at *0x801257D0: 0xC0 is the one being drawn, 0xC2/0xC4/0xC6 the
# ones in use. The entry wait loads 0xC0 once and spins on the register; the
# retry loop runs when all three are taken. Yield in both, and re-read 0xC0.
[[patches.hook]]
func = "func_8007E248"
before_vram = 0x8007E258
text = """
    if (ctx->r8 != ctx->r7) { btx_yield_via_priority_drop(rdram); ctx->r8 = MEM_H(ctx->r5, 0xC0); }
"""

[[patches.hook]]
func = "func_8007E248"
before_vram = 0x8007E2B8
text = """
    if (ctx->r2 == ctx->r7) { btx_yield_via_priority_drop(rdram); }
"""

# func_800A8EE0: while (*(u32*)0x802E17D0 != 0) {} (sequel: func_80079FF0).
[[patches.hook]]
func = "func_800A8EE0"
before_vram = 0x800A8EE0
text = """
    if (MEM_W(S32(0x802E << 16), 0x17D0) != 0) { btx_yield_via_priority_drop(rdram); }
"""

# --- Rendering ----------------------------------------------------------------

# Widescreen (src/game/widescreen.cpp): widen the per-player cull cone by
# RT64's Expand factor, so the world isn't culled at the old 4:3 edges. Both
# paths that store the cull factor at sp+0x14 meet here.
[[patches.hook]]
func = "func_8008228C"
before_vram = 0x800823D0
text = """
    btx_widen_cull(rdram, ctx);
"""

# Widescreen HUD (src/game/hud_anchor.cpp): once the HUD function has drawn
# the frame's HUD into its own list, anchor its left and right parts to the
# window edges.
[[patches.hook]]
func = "func_800F5B6C"
before_vram = 0x800F6664
text = """
    btx_hud_anchor(rdram, ctx);
"""

# Matrix IDs for RT64's frame interpolation (src/game/interpolation_ids.cpp):
# a gEXMatrixGroup ahead of every gSPMatrix the game's matrix functions write.
# Float matrix -> Mtx emitters, at the gSPMatrix (the cached-Mtx ones, where
# both paths meet): float matrix, then the Mtx.
[[patches.hook]]
func = "func_8007E41C"
before_vram = 0x8007E46C
text = """
    btx_interp_float_matrix(rdram, 0xD8, (uint32_t)ctx->r8, (uint32_t)MEM_W(0xE8, ctx->r16));
"""

